<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GetFlop · Table TV</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="app.css">
  <style>
    /* Sized for a TV in the club: everything scales with the screen, no scrolling. */
    html, body { height: 100%; overflow: hidden; }
    body.tv { font-size: 1.05vw; }
    #app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
    .tv header { display: flex; align-items: center; gap: 1.6vw; padding: 1.2vw 2vw; min-height: 7vw; background: rgba(0,0,0,.3); border-bottom: 1px solid var(--line); }
    .tv header .brand { font-size: 2vw; }
    .tv header .tname { font-size: 1.8vw; font-weight: 700; }
    .tv header .hand { font-size: 1.4vw; color: var(--muted); }
    .tv header .pill { font-size: 1.1vw; padding: .3vw 1vw; }
    .tv header .clock { margin-left: auto; font-size: 3.4vw; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 8vw; text-align: right; }
    .tv header .clock.hurry { color: var(--red); }
    .tv main { display: grid; grid-template-columns: 38fr 62fr; gap: 1.6vw; padding: 1.6vw 2vw; min-height: 0; }
    .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6vw; background: var(--panel); border: 1px solid var(--line); border-radius: 1vw; padding: 2vw; min-height: 0; }
    .stage .flop { gap: 1vw; }
    .stage .pc { width: 9vw; height: 12.6vw; font-size: 4.6vw; border-radius: .9vw; }
    .stage .pc .s { font-size: 4vw; }
    .stage .msg { font-size: 2.2vw; font-weight: 800; text-align: center; }
    .stage .sub { font-size: 1.3vw; color: var(--muted); text-align: center; }
    .stage .winners { display: flex; flex-wrap: wrap; gap: .6vw; justify-content: center; }
    .stage .winners span { background: var(--green); color: #002a14; font-weight: 800; border-radius: 99px; padding: .3vw 1vw; font-size: 1.2vw; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: .8vw; min-height: 0; }
    .board .m { background: var(--panel-2); border: 1px solid var(--line); border-radius: .8vw; padding: .8vw 1vw; display: flex; flex-direction: column; justify-content: space-between; min-height: 0; transition: box-shadow .3s, border-color .3s, opacity .3s; }
    .board .m .o { font-size: 2.4vw; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1; }
    .board .m .n { font-size: 1.05vw; line-height: 1.2; }
    .board .m .meta { display: flex; justify-content: space-between; font-size: .9vw; color: var(--muted); }
    .board .m.win { border-color: var(--green); box-shadow: 0 0 0 .2vw var(--green) inset, 0 0 2vw rgba(63,191,127,.35); }
    .board .m.lose { opacity: .45; }
    .tv footer { display: grid; grid-template-columns: 1fr auto; gap: 2vw; align-items: center; padding: 1vw 2vw; background: rgba(0,0,0,.3); border-top: 1px solid var(--line); }
    .strip { display: flex; gap: 1.2vw; overflow: hidden; }
    .strip .h { display: flex; flex-direction: column; align-items: center; gap: .3vw; font-size: .8vw; color: var(--muted); }
    .strip .pc.small { width: 2vw; height: 2.8vw; font-size: 1.1vw; }
    .strip .pc.small .s { font-size: 1vw; }
    .side { display: flex; gap: 2vw; align-items: center; }
    .lb { font-size: 1vw; min-width: 18vw; }
    .lb .t { color: var(--gold); font-weight: 700; margin-bottom: .3vw; }
    .lb .r { display: flex; justify-content: space-between; gap: 1vw; }
    .join { text-align: right; }
    .join .u { font-size: 1.6vw; font-weight: 800; color: var(--gold); }
    /* Only visible while a mouse is over the page (setting the TV up), never on the TV itself. */
    #fs { position: fixed; left: 50%; top: .6vw; transform: translateX(-50%); opacity: 0; transition: opacity .2s; }
    body:hover #fs { opacity: .8; }
    .picker { padding: 4vw; }
    .picker a { display: block; font-size: 2vw; margin: 1vw 0; }
  </style>
</head>
<body class="tv">
  <div id="app"></div>
  <script type="module" src="tv.js"></script>
</body>
</html>
