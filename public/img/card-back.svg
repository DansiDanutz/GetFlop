<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" preserveAspectRatio="none">
  <!-- GetFlop card back: burgundy lattice, gold monogram. -->
  <defs>
    <pattern id="lat" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#7a1d25"/><rect width="5" height="10" fill="#8f2530"/>
    </pattern>
  </defs>
  <rect width="100" height="140" rx="9" fill="#fff"/>
  <rect x="6" y="6" width="88" height="128" rx="6" fill="url(#lat)"/>
  <rect x="10" y="10" width="80" height="120" rx="4" fill="none" stroke="#f2c14e" stroke-width="1.2" opacity=".7"/>
  <circle cx="50" cy="70" r="19" fill="#0d3b2e" stroke="#f2c14e" stroke-width="2.4"/>
  <text x="50" y="77" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#f2c14e">GF</text>
</svg>
